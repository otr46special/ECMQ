<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ヨーロッパ文化・地理クイズ 首都つき版</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:rgba(0,0,0,0);}
html,body{margin:0;padding:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:#f3f6fb;color:#1f2937;}
body{-webkit-text-size-adjust:100%;}
.wrap{max-width:1180px;margin:0 auto;padding:14px;}
h1{font-size:25px;margin:0 0 6px;line-height:1.25;}
.lead{margin:0 0 12px;color:#526070;line-height:1.6;font-size:14px;}
.app{display:block;}
.mapcard,.panel{background:#fff;border:1px solid #dde3ee;border-radius:16px;box-shadow:0 4px 12px rgba(15,23,42,.06);}
.mapcard{padding:10px;margin-bottom:12px;overflow:hidden;}
.panel{padding:12px;}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:8px;}
.pill{display:inline-block;border:1px solid #d8e1ef;border-radius:999px;padding:6px 10px;background:#f8fbff;color:#475569;font-size:13px;}
svg{width:100%;height:auto;display:block;background:#dff2ff;border:1px solid #c9e2f7;border-radius:12px;touch-action:manipulation;}
.country{fill:#f8fafc;stroke:#7b8794;stroke-width:1;vector-effect:non-scaling-stroke;}
.country.dim{opacity:.22;}
.country.target{fill:#ffe083;stroke:#9a5a00;stroke-width:2.4;}
.country.done{fill:#b7ead0;stroke:#28835a;}
.label{pointer-events:none;font-weight:800;fill:#111827;text-anchor:middle;dominant-baseline:central;display:none;}
.label.show{display:block;}
.targetMark{pointer-events:none;font-size:24px;font-weight:900;fill:#7a4500;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#fff8e1;stroke-width:4px;}
.row{margin-bottom:10px;}
label{display:block;font-weight:800;margin-bottom:6px;}
select,input,button{font-size:16px;width:100%;border-radius:12px;padding:12px;border:1px solid #cbd5e1;background:#fff;color:#111827;}
button{border:0;background:#2563eb;color:#fff;font-weight:900;min-height:46px;touch-action:manipulation;}
button:disabled{opacity:.45;}
button.secondary{background:#eaf2ff;color:#1d4ed8;border:1px solid #bcd4ff;}
button.ghost{background:#fff;color:#374151;border:1px solid #cbd5e1;}
button:active{transform:translateY(1px);}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.score{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin:10px 0;}
.score div{text-align:center;border:1px solid #e2e8f0;background:#f8fafc;border-radius:12px;padding:8px;}
.score span{display:block;font-size:12px;color:#64748b;}
.score b{font-size:20px;}
.status{min-height:82px;line-height:1.6;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:10px;}
.questionType{display:inline-block;font-size:12px;border-radius:999px;background:#eef2ff;color:#3730a3;padding:3px 8px;margin-bottom:4px;font-weight:900;}
.choiceGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.choiceBtn{background:#fff;color:#111827;border:1px solid #cbd5e1;font-weight:900;min-height:58px;text-align:left;line-height:1.35;}
.choiceBtn:disabled{opacity:1;}
.choiceBtn.wrongChoice{background:#fee2e2;color:#991b1b;border:2px solid #dc2626;}
.choiceBtn.correctChoice{background:#dcfce7;color:#166534;border:2px solid #16a34a;}
.choiceBtn.locked{opacity:.55;}
.ok{color:#047857;font-weight:900;}
.bad{color:#dc2626;font-weight:900;}
.small{font-size:13px;color:#64748b;line-height:1.55;}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:#475569;}
.sw{display:inline-block;width:14px;height:14px;border:1px solid #777;border-radius:4px;margin-right:4px;vertical-align:-2px;}
.factCard{background:#fffaf0;border:1px solid #fed7aa;border-radius:12px;padding:10px;margin-top:8px;font-size:14px;line-height:1.55;}
.factCard b{color:#9a3412;}
.mediaGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
.mediaCard{background:#ffffff;border:1px solid #f5d0a8;border-radius:12px;padding:8px;text-align:center;}
.mediaCard img{display:block;width:100%;max-width:280px;height:180px;object-fit:cover;margin:0 auto 6px;border-radius:10px;border:1px solid #f5c28b;background:#fff;}
.mediaCard.flagCard img{height:140px;object-fit:contain;background:#f8fafc;}
.mediaLabel{font-size:12px;color:#7c2d12;line-height:1.4;}
.nextWrap{margin-top:12px;text-align:center;}
.nextWrap button{max-width:220px;}
.timeWarn{color:#dc2626!important;font-weight:900;}
@media (max-width:560px){.mediaGrid{grid-template-columns:1fr;}}
.timeUp{background:#fff7ed;border-color:#fb923c;}
@media (max-width:560px){.choiceGrid{grid-template-columns:1fr;}.score b{font-size:18px;}.score{gap:6px;}}
@media (min-width:900px){.app{display:grid;grid-template-columns:1fr 340px;gap:14px;align-items:start;}.mapcard{margin-bottom:0;}}
</style>
</head>
<body>
<div class="wrap">
<h1>ヨーロッパ文化・地理クイズ 首都つき版</h1>
<p class="lead">国名だけでなく、首都・国の形・代表的な食べ物・世界遺産・国の特徴を4択で答える中高生向けクイズです。正解後にミニ解説が出ます。</p>
<div class="app">
<section class="mapcard">
<div class="tools"><span class="pill" id="rangeLabel">範囲：主要20か国</span><span class="pill">文化＋地理</span></div>
<svg id="map" viewBox="0 0 1000 650" role="img" aria-label="ヨーロッパの学習用地図">
<rect x="0" y="0" width="1000" height="650" fill="#dff2ff"></rect>
<text x="54" y="48" fill="#5e7c98" font-size="24" font-weight="800">Europe</text>
<g id="countries"></g><g id="labels"></g><g id="marker"></g>
</svg>
<div class="legend"><span><span class="sw" style="background:#ffe083"></span>今の問題</span><span><span class="sw" style="background:#b7ead0"></span>正解済み</span><span><span class="sw" style="background:#f8fafc"></span>出題範囲</span></div>
<p class="small">※地図は学習用の簡略版です。世界遺産・食べ物は「代表例」として扱います。</p>
</section>
<aside class="panel">
<div class="row"><label for="range">出題範囲</label><select id="range">
<option value="main20">主要20か国</option>
<option value="centralwest">西・中央ヨーロッパ</option>
<option value="north">北ヨーロッパ</option>
<option value="south">南ヨーロッパ</option>
<option value="balkan">バルカン半島周辺</option>
<option value="east">東ヨーロッパ</option>
<option value="all">全部（39か国）</option>
</select></div>
<div class="row"><label for="mode">問題タイプ</label><select id="mode">
<option value="mix">ミックス</option>
<option value="country">国名を答える</option>
<option value="capital">首都を答える</option>
<option value="shape">形・位置から国名</option>
<option value="food">代表的な食べ物</option>
<option value="heritage">有名な世界遺産</option>
<option value="feature">国の特徴</option>
</select></div>
<div class="row"><label for="timeLimit">制限時間</label><select id="timeLimit">
<option value="0">なし</option>
<option value="60">1分</option>
<option value="180">3分</option>
<option value="300" selected>5分</option>
<option value="600">10分</option>
</select></div>
<div class="score"><div><span>正解</span><b id="doneCount">0</b></div><div><span>残り</span><b id="leftCount">0</b></div><div><span>ミス</span><b id="missCount">0</b></div><div><span>時間</span><b id="timerText">--:--</b></div></div>
<div class="row status" id="status">「開始」を押してください。</div>
<div class="row"><label>選択肢</label><div id="choices" class="choiceGrid"><div class="small">「開始」を押すと選択肢が出ます。</div></div></div>
<div class="row grid"><button id="hint" class="secondary" disabled>ヒント</button><button id="start" class="secondary">開始 / やり直し</button></div>
<div class="row"><button id="clear" class="ghost">リセット</button></div>
<p class="small">授業導入・復習用の試作版です。正解後に代表的な料理写真・世界遺産写真・国旗をオンラインで表示します。難易度を下げる場合は「国名」や「食べ物」から始めると入りやすいです。</p>
</aside>
</div>
</div>

CROATIA:'Old_City_of_Dubrovnik',KOSOVO:'Visoki_Dečani',SWITZERLAND:'Old_City_of_Bern',SWEDEN:'Drottningholm_Palace',SPAIN:'Alhambra',
SLOVAKIA:'Spiš_Castle',SLOVENIA:'Škocjan_Caves',SERBIA:'Stari_Ras',CZECHIA:'Prague',DENMARK:'Jelling_stones',
GERMANY:'Cologne_Cathedral',NORWAY:'West_Norwegian_Fjords',HUNGARY:'Budapest',FINLAND:'Suomenlinna',FRANCE:'Mont-Saint-Michel',
BULGARIA:'Rila_Monastery',BELARUS:'Mir_Castle_Complex',BELGIUM:'Grand-Place',BOSNIA_AND_HERZ:'Stari_Most',PORTUGAL:'Belém_Tower',
POLAND:'Kraków_Old_Town',MOLDOVA:'Struve_Geodetic_Arc',MONTENEGRO:'Natural_and_Culturo-Historical_Region_of_Kotor',LATVIA:'Historic_Centre_of_Riga',LITHUANIA:'Vilnius_Old_Town',
LUXEMBOURG:'Luxembourg_City',ROMANIA:'Sighișoara',RUSSIA:'Moscow_Kremlin',MACEDONIA:'Natural_and_Cultural_Heritage_of_the_Ohrid_region'
};
var FLAG_CODES={
ICELAND:'is',IRELAND:'ie',ALBANIA:'al',UNITED_KINGDOM:'gb',ITALY:'it',UKRAINE:'ua',ESTONIA:'ee',NETHERLANDS:'nl',AUSTRIA:'at',GREECE:'gr',
CROATIA:'hr',KOSOVO:'xk',SWITZERLAND:'ch',SWEDEN:'se',SPAIN:'es',SLOVAKIA:'sk',SLOVENIA:'si',SERBIA:'rs',CZECHIA:'cz',DENMARK:'dk',
GERMANY:'de',NORWAY:'no',HUNGARY:'hu',FINLAND:'fi',FRANCE:'fr',BULGARIA:'bg',BELARUS:'by',BELGIUM:'be',BOSNIA_AND_HERZ:'ba',PORTUGAL:'pt',
POLAND:'pl',MOLDOVA:'md',MONTENEGRO:'me',LATVIA:'lv',LITHUANIA:'lt',LUXEMBOURG:'lu',ROMANIA:'ro',RUSSIA:'ru',MACEDONIA:'mk'
};
var state={range:'main20',mode:'mix',queue:[],current:null,currentType:'country',done:{},misses:0,activeIds:{},choices:[],wrongChoices:{},started:false,timeLimit:300,timeLeft:300,timerId:null,timeOver:false,awaitingNext:false};
function el(id){return document.getElementById(id);}
function hasGroup(c,g){for(var i=0;i<c.groups.length;i++){if(c.groups[i]===g)return true;}return false;}
function hasId(obj,id){return obj[id]===true;}
function clearObj(o){for(var k in o){if(o.hasOwnProperty(k))delete o[k];}}
function countObj(o){var n=0;for(var k in o){if(o.hasOwnProperty(k)&&o[k]===true)n++;}return n;}
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuffle(a){var r=a.slice(0);for(var i=r.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=r[i];r[i]=r[j];r[j]=t;}return r;}
function activeCountries(){var r=[];for(var i=0;i<COUNTRIES.length;i++){if(hasGroup(COUNTRIES[i],state.range))r.push(COUNTRIES[i]);}return r;}
function setClass(node,cls){if(node&&node.getAttribute('class')!==cls)node.setAttribute('class',cls);}
function renderBaseMap(){var gc=el('countries'),gl=el('labels');gc.innerHTML='';gl.innerHTML='';for(var i=0;i<COUNTRIES.length;i++){var c=COUNTRIES[i];var p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',c.d);p.setAttribute('id','country-'+c.id);p.setAttribute('class','country');p.setAttribute('fill-rule','evenodd');gc.appendChild(p);var tx=document.createElementNS('http://www.w3.org/2000/svg','text');tx.setAttribute('id','label-'+c.id);tx.setAttribute('class','label');tx.setAttribute('x',c.x);tx.setAttribute('y',c.y);tx.setAttribute('font-size',c.font||12);tx.appendChild(document.createTextNode(c.jp));gl.appendChild(tx);}}
function setRange(r){state.range=r;clearObj(state.activeIds);for(var i=0;i<COUNTRIES.length;i++){if(hasGroup(COUNTRIES[i],r))state.activeIds[COUNTRIES[i].id]=true;}el('rangeLabel').innerHTML='範囲：'+rangeNames[r];updateMap();updateScore();}
function getSelectedTimeLimit(){var v=0;try{v=parseInt(el('timeLimit').value,10)||0;}catch(e){v=0;}return v;}
function formatTime(sec){if(sec<=0)return'0:00';var m=Math.floor(sec/60),s=sec%60;return m+':'+(s<10?'0':'')+s;}
function stopTimer(){if(state.timerId){clearInterval(state.timerId);state.timerId=null;}}
function updateTimerDisplay(){var t=el('timerText');if(!t)return;if(!state.started&&!state.timeOver){var lim=getSelectedTimeLimit();t.innerHTML=(lim>0?formatTime(lim):'なし');t.className='';return;}if(state.timeLimit<=0){t.innerHTML='なし';t.className='';return;}t.innerHTML=formatTime(state.timeLeft);t.className=(state.timeLeft<=10&&state.started)?'timeWarn':'';}
function startTimer(){stopTimer();state.timeLimit=getSelectedTimeLimit();state.timeLeft=state.timeLimit;state.timeOver=false;updateTimerDisplay();if(state.timeLimit>0){state.timerId=setInterval(function(){state.timeLeft--;if(state.timeLeft<=0){state.timeLeft=0;updateTimerDisplay();timeUp();}else updateTimerDisplay();},1000);}}
function timeUp(){if(state.timeOver)return;stopTimer();state.timeOver=true;state.started=false;el('hint').disabled=true;lockChoices();var done=countObj(state.done),total=activeCountries().length;el('status').className='row status timeUp';el('status').innerHTML='<span class="bad">時間切れ！</span><br>結果：'+done+' / '+total+'問正解、ミス：'+state.misses+'回。';updateTimerDisplay();}
function lockChoices(){var box=el('choices');var buttons=box.getElementsByTagName('button');for(var i=0;i<buttons.length;i++){buttons[i].disabled=true;buttons[i].className=buttons[i].className+' locked';}}
function chooseType(){var m=el('mode').value;state.mode=m;if(m!=='mix')return m;var types=['country','capital','shape','food','heritage','feature'];return types[Math.floor(Math.random()*types.length)];}
function valueFor(c,t){if(t==='country'||t==='shape')return c.jp;if(t==='capital')return c.capital;if(t==='food')return c.food;if(t==='heritage')return c.heritage;if(t==='feature')return c.feature;return c.jp;}
function makeChoices(correct,type){var pool=[],all=activeCountries();for(var i=0;i<all.length;i++){if(all[i].id!==correct.id)pool.push(all[i]);}pool=shuffle(pool);var arr=[{id:correct.id,text:valueFor(correct,type)}];for(var j=0;j<pool.length&&arr.length<4;j++){arr.push({id:pool[j].id,text:valueFor(pool[j],type)});}return shuffle(arr);}
function renderChoices(){var box=el('choices');if(!state.current){box.innerHTML='<div class="small">「開始」を押すと選択肢が出ます。</div>';return;}var html='';for(var i=0;i<state.choices.length;i++){var ch=state.choices[i];var cls='choiceBtn';if(state.wrongChoices[ch.id]===true)cls+=' wrongChoice';html+='<button type="button" class="'+cls+'" data-id="'+ch.id+'" '+((state.timeOver||state.awaitingNext)?'disabled':'')+'>'+escapeHtml(ch.text)+'</button>';}box.innerHTML=html;var buttons=box.getElementsByTagName('button');for(var j=0;j<buttons.length;j++){buttons[j].onclick=function(){chooseAnswer(this.getAttribute('data-id'),this);};}}
function promptText(c,t){if(t==='country')return '黄色で光っている国の名前はどれですか。';if(t==='capital')return '黄色で光っている国の首都はどれですか。';if(t==='shape')return '黄色の国の形・位置を見て、国名を選びましょう。';if(t==='food')return '黄色で光っている国の代表的な食べ物はどれですか。';if(t==='heritage')return '黄色で光っている国の有名な世界遺産はどれですか。';if(t==='feature')return '黄色で光っている国の特徴として正しいものはどれですか。';return '正しいものを選びましょう。';}
function factCard(c){
  return '<div class="factCard"><b>'+escapeHtml(c.jp)+'</b><br>首都：'+escapeHtml(c.capital)+'<br>食べ物：'+escapeHtml(c.food)+'<br>世界遺産：'+escapeHtml(c.heritage)+'<br>特徴：'+escapeHtml(c.feature)+
  '<div class="mediaGrid">'+
  '<div class="mediaCard flagCard"><div id="flagArea"><div class="small">国旗を読み込み中...</div></div></div>'+
  '<div class="mediaCard"><div id="foodPhotoArea"><div class="small">料理写真を読み込み中...</div></div></div>'+
  '<div class="mediaCard"><div id="heritagePhotoArea"><div class="small">世界遺産写真を読み込み中...</div></div></div>'+
  '</div>'+
  '<div class="nextWrap"><button id="nextBtn" type="button">次へ</button></div></div>';
}
function loadWikiPhoto(page, areaId, label){
  var area=el(areaId);
  if(!area)return;
  if(!page){area.innerHTML='<div class="small">写真はありません。</div>';return;}
  var url='https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(page);
  fetch(url).then(function(r){return r.json();}).then(function(data){
    if(data && data.thumbnail && data.thumbnail.source){
      area.innerHTML='<img src="'+data.thumbnail.source+'" alt="'+escapeHtml(label)+' の写真"><div class="mediaLabel">'+escapeHtml(label)+'</div>';
    }else{
      area.innerHTML='<div class="small">写真を表示できませんでした。'+escapeHtml(label)+'</div>';
    }
  }).catch(function(){
    area.innerHTML='<div class="small">写真を読み込めませんでした。'+escapeHtml(label)+'</div>';
  });
}
function loadFlag(c){
  var area=el('flagArea');
  if(!area)return;
  var code=FLAG_CODES[c.id];
  if(!code){area.innerHTML='<div class="small">国旗画像はありません。</div>';return;}
  var src='https://flagcdn.com/w320/'+code+'.png';
  area.innerHTML='<img src="'+src+'" alt="'+escapeHtml(c.jp)+' の国旗"><div class="mediaLabel">国旗</div>';
}
function showCorrectInfo(c){
  state.awaitingNext=true;
  el('status').className='row status';
  el('status').innerHTML='<span class="ok">正解！</span> '+escapeHtml(c.jp)+'<br>'+factCard(c);
  loadFlag(c);
  loadWikiPhoto(FOOD_PAGES[c.id],'foodPhotoArea','代表的な料理：'+c.food);
  loadWikiPhoto(HERITAGE_PAGES[c.id],'heritagePhotoArea','有名な世界遺産：'+c.heritage);
  var nb=el('nextBtn');
  if(nb)nb.onclick=function(){goNext();};
}
function startGame(){var a=activeCountries();stopTimer();state.queue=shuffle(a);clearObj(state.done);clearObj(state.wrongChoices);state.choices=[];state.misses=0;state.started=true;state.current=null;state.timeOver=false;state.awaitingNext=false;el('hint').disabled=false;el('status').className='row status';startTimer();nextQuestion();}
function goNext(){if(!state.awaitingNext)return;state.awaitingNext=false;nextQuestion();}
function nextQuestion(){state.awaitingNext=false;clearObj(state.wrongChoices);if(state.queue.length===0){stopTimer();state.current=null;state.started=false;state.choices=[];el('hint').disabled=true;el('marker').innerHTML='';var timeMsg=state.timeLimit>0?'<br>残り時間：'+formatTime(state.timeLeft):'';el('status').className='row status';el('status').innerHTML='<span class="ok">完成！</span><br>この範囲をクリアしました。ミス：'+state.misses+'回'+timeMsg;renderChoices();updateMap();updateScore();updateTimerDisplay();return;}state.current=state.queue[0];state.currentType=chooseType();state.choices=makeChoices(state.current,state.currentType);el('status').className='row status';el('status').innerHTML='<span class="questionType">'+typeNames[state.currentType]+'</span><br>'+promptText(state.current,state.currentType);renderChoices();updateMap();updateScore();}
function chooseAnswer(id,btn){if(!state.current||state.timeOver||state.awaitingNext)return;var c=state.current;if(id===c.id){state.done[c.id]=true;state.queue.shift();if(btn)btn.className='choiceBtn correctChoice';showCorrectInfo(c);updateMap();updateScore();}else{state.misses++;state.wrongChoices[id]=true;el('status').className='row status';el('status').innerHTML='<span class="bad">まだ違います。</span><br>もう一度考えて選びましょう。';renderChoices();updateScore();}}
function showHint(){if(!state.current||state.timeOver)return;var c=state.current;var region='';if(hasGroup(c,'north'))region='北ヨーロッパ';else if(hasGroup(c,'centralwest'))region='西・中央ヨーロッパ';else if(hasGroup(c,'south'))region='南ヨーロッパ';else if(hasGroup(c,'east'))region='東ヨーロッパ';else region='ヨーロッパ';el('status').className='row status';el('status').innerHTML='ヒント：この国は <b>'+region+'</b> にあります。国名は「<b>'+escapeHtml(c.jp.charAt(0))+'</b>」から始まります。';}
function updateScore(){var done=countObj(state.done),total=activeCountries().length;el('doneCount').innerHTML=done;el('leftCount').innerHTML=Math.max(0,total-done);el('missCount').innerHTML=state.misses;}
function updateMap(){for(var i=0;i<COUNTRIES.length;i++){var c=COUNTRIES[i],p=el('country-'+c.id),l=el('label-'+c.id);if(!p||!l)continue;var cls='country';if(!hasId(state.activeIds,c.id))cls+=' dim';if(hasId(state.done,c.id)){cls+=' done';setClass(l,'label show');}else setClass(l,'label');if(state.current&&state.current.id===c.id)cls+=' target';setClass(p,cls);}var gm=el('marker');gm.innerHTML='';if(state.current){var t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('class','targetMark');t.setAttribute('x',state.current.x);t.setAttribute('y',state.current.y-24);t.appendChild(document.createTextNode('？'));gm.appendChild(t);}}
function resetGame(msg){stopTimer();clearObj(state.done);clearObj(state.wrongChoices);state.queue=[];state.current=null;state.choices=[];state.started=false;state.timeOver=false;state.awaitingNext=false;state.timeLimit=getSelectedTimeLimit();state.timeLeft=state.timeLimit;state.misses=0;el('hint').disabled=true;el('marker').innerHTML='';el('status').className='row status';el('status').innerHTML=msg;renderChoices();updateMap();updateScore();updateTimerDisplay();}
function bind(){el('range').onchange=function(){setRange(this.value);resetGame('範囲を変更しました。「開始」を押してください。');};el('mode').onchange=function(){resetGame('問題タイプを変更しました。「開始」を押してください。');};el('timeLimit').onchange=function(){resetGame('制限時間を変更しました。「開始」を押してください。');};el('start').onclick=startGame;el('clear').onclick=function(){resetGame('リセットしました。「開始」を押すと始まります。');};el('hint').onclick=showHint;}
try{renderBaseMap();bind();setRange('main20');renderChoices();updateTimerDisplay();}catch(err){var st=document.getElementById('status');if(st)st.innerHTML='<span class="bad">読み込みエラー：</span>'+err.message;}
})();
</script>
